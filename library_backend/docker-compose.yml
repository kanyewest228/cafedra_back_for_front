services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_backend_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=library_db
      - DB_USERNAME=library_user
      - DB_PASSWORD=library_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_net

  nginx:
    image: nginx:1.27-alpine
    container_name: library_backend_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - library_net

  postgres:
    image: postgres:16-alpine
    container_name: library_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - library_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: library_backend_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  library_net:
    driver: bridge
